<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf8f3">
  <title>AC Edu Engagement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script>
    // Apply the saved page colours before the page draws, so there is no flash
    (function () {
      var t = "default";
      try { t = localStorage.getItem("ac-hub-theme") || t; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="description" content="Learning games for children: maths, spelling, computational thinking, STEM, financial literacy and art.">
  <style>
    :root {
      --bg: #fbf8f3;
      --ink: #14213d;
      --muted: #4a5568;
      --card: #ffffff;
      --line: #e7e1d6;
      --brand: #2b4acb;
      --ruled: #d9e7f4;
      --page-accent: #2b4acb;
      --radius: 22px;
      --focus: #2b4acb;
    }
    * { box-sizing: border-box; }
    html { font-size: 112.5%; }
    body {
      margin: 0; min-height: 100vh;
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .skip {
      position: absolute; left: 1rem; top: -4rem; z-index: 10;
      background: var(--ink); color: #fff; font-weight: 800;
      padding: .75rem 1rem; border-radius: 12px;
    }
    .skip:focus { top: 1rem; }

    /* Slim header (hidden on the home page, where the hero carries the title) */
    header.site {
      padding: .75rem 1.25rem; background: #fff; border-bottom: 2px solid var(--line);
    }
    body[data-page="home"] header.site { display: none; }
    header.site a {
      color: var(--ink); text-decoration: none; font-weight: 800;
      display: inline-flex; align-items: center; gap: .75rem;
      padding: .25rem .5rem; border-radius: 12px;
    }
    header.site img {
      width: 44px; height: 44px; border-radius: 50%; flex: none;
      border: 2px solid var(--line); background: #fff;
    }

    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 2rem; }
    main:focus { outline: none; }
    h1:focus { outline: none; }
    h1 { font-size: 2.3rem; line-height: 1.15; margin: .5rem 0; letter-spacing: -.01em; font-weight: 800; }
    h2 { font-size: 1.2rem; margin: 0; line-height: 1.25; font-weight: 800; }
    .lead { font-size: 1.2rem; color: var(--muted); margin: 0 0 1.5rem; }

    /* Icons */
    .icon-svg { display: inline-flex; width: 100%; height: 100%; }
    .icon-svg svg { width: 100%; height: 100%; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center; flex: none;
      width: 3.4rem; height: 3.4rem; border-radius: 18px;
      background: var(--accent, var(--page-accent)); color: #fff;
    }
    .badge .icon-svg { width: 62%; height: 62%; }

    /* Home hero and wordmark */
    .hero { text-align: center; padding: 1.5rem 0 1.5rem; }
    .hero-logo {
      width: 104px; height: 104px; border-radius: 50%; background: #fff;
      border: 4px solid #fff; box-shadow: 0 0 0 2px var(--line), 0 6px 16px rgba(20, 33, 61, .12);
    }
    .wordmark { margin: 1rem 0 .4rem; line-height: 1; }
    .wordmark .ac {
      display: block; font-size: clamp(3.5rem, 12vw, 6.5rem); font-weight: 900;
      letter-spacing: -.04em; color: var(--brand);
    }
    .wordmark .rest {
      display: block; margin-top: .3rem;
      font-size: clamp(.95rem, 3.6vw, 1.6rem); font-weight: 600;
      letter-spacing: .34em; text-transform: uppercase; color: var(--ink);
      padding-left: .34em; /* balances the trailing letter-space so the text looks centred */
    }
    .hero .lead { margin: 1rem auto 0; max-width: 60ch; }

    /* Centred, wrapping grid: a short last row sits in the middle */
    .grid {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem;
    }
    .grid > li { flex: 0 1 300px; display: flex; }
    .grid > li > a, .grid > li > div { width: 100%; }

    /* Subject cards */
    .category-card {
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center;
      gap: .3rem; padding: 1.25rem 1rem;
      background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
      color: var(--ink); text-decoration: none;
      box-shadow: 0 4px 0 var(--line);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .category-card .badge { margin-bottom: .2rem; }
    .category-card .card-title { font-size: 1.25rem; font-weight: 800; line-height: 1.2; }
    .category-card .card-blurb { font-size: .95rem; color: var(--muted); line-height: 1.35; }
    .pill {
      margin-top: .3rem; padding: .1rem .8rem; border-radius: 999px;
      background: #f1ede4; color: var(--ink); font-weight: 800; font-size: .8rem;
    }

    /* Back button */
    .back {
      display: inline-flex; align-items: center; gap: .25rem;
      min-height: 48px; padding: .5rem 1.2rem; margin-bottom: .75rem;
      background: #fff; color: var(--ink); font-weight: 800; text-decoration: none;
      border: 2px solid var(--ink); border-radius: 999px;
    }

    /* Category page heading picks up the subject colour */
    body[data-page="category"] h1 { display: flex; align-items: center; gap: .7rem; }

    /* Game cards */
    .game-card {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: .5rem; height: 100%;
      background: var(--card); color: var(--ink);
      border: 2px solid var(--line); border-radius: var(--radius);
      padding: .85rem; text-decoration: none;
      box-shadow: 0 4px 0 var(--line);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .game-card .card-blurb { margin: 0; color: var(--muted); flex: 1; }
    .thumb {
      width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px;
      background: #f1ede4;
    }
    .thumb-icon {
      display: flex; align-items: center; justify-content: center;
      background: var(--page-accent); color: #fff;
    }
    .thumb-icon .icon-svg { width: 5.5rem; height: 5.5rem; }
    .play, .soon {
      align-self: center; font-weight: 800; padding: .4rem 1.6rem; min-height: 44px;
      border-radius: 999px; display: inline-flex; align-items: center;
    }
    .play { background: var(--ink); color: #fff; }
    .soon { background: #f1ede4; color: var(--muted); }
    .game-card.disabled { border-style: dashed; box-shadow: none; }

    a.category-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 7px 0 var(--accent); }
    a.game-card:hover { transform: translateY(-3px); border-color: var(--page-accent); box-shadow: 0 7px 0 var(--page-accent); }
    a:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }

    /* Scan-to-open QR code, home page only, top right */
    .scan {
      display: none; margin: 0;
      position: absolute; top: 1.2rem; right: 1rem; width: 88px;
      text-align: center; color: var(--muted); font-size: .7rem; font-weight: 800;
    }
    .scan img {
      display: block; width: 100%; height: auto; border-radius: 10px; background: #fff;
      border: 2px solid var(--line);
    }
    .scan figcaption { margin-top: .3rem; letter-spacing: .08em; text-transform: uppercase; }
    @media (min-width: 700px) { body[data-page="home"] .scan { display: block; } }

    footer { text-align: center; color: var(--muted); padding: .6rem 1rem 1rem; font-size: .8rem; }
    footer p { display: inline; margin: 0; }
    footer p + p::before { content: "\00a0\00b7\00a0"; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.8rem; }
      .wordmark .rest { letter-spacing: .22em; padding-left: .22em; }
    }

    /* ===== Home page: everything fits on one screen, no scrolling ===== */
    body[data-page="home"] {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
    }
    body[data-page="home"] main {
      flex: 1; width: 100%; padding: .5rem 1.25rem;
      display: flex; flex-direction: column; justify-content: center;
    }
    body[data-page="home"] .hero { padding: .25rem 0 .9rem; }
    body[data-page="home"] .hero-logo {
      width: clamp(60px, 11vh, 96px); height: clamp(60px, 11vh, 96px); border-width: 3px;
    }
    body[data-page="home"] .wordmark { margin: .6rem 0 .3rem; }
    body[data-page="home"] .wordmark .ac { font-size: clamp(2.6rem, min(14vw, 12vh), 5.5rem); }
    body[data-page="home"] .wordmark .rest { font-size: clamp(.8rem, min(4.2vw, 2.6vh), 1.5rem); margin-top: .2rem; }
    body[data-page="home"] .hero .lead { margin: .6rem auto 0; font-size: clamp(.9rem, 2.4vh, 1.15rem); }
    body[data-page="home"] .grid { gap: .75rem; }
    body[data-page="home"] .grid > li { flex: 0 1 calc(33.333% - .55rem); }
    body[data-page="home"] .category-card { padding: .9rem .6rem; gap: .2rem; border-radius: 20px; }
    body[data-page="home"] .category-card .badge {
      width: clamp(2.4rem, 6vh, 3.2rem); height: clamp(2.4rem, 6vh, 3.2rem); border-radius: 14px; margin-bottom: .15rem;
    }
    body[data-page="home"] .category-card .card-title { font-size: clamp(1rem, 2.4vh, 1.2rem); }
    body[data-page="home"] .category-card .card-blurb { display: none; }
    body[data-page="home"] .pill { font-size: .8rem; padding: .1rem .7rem; margin-top: .15rem; }
    @media (max-width: 900px) {
      body[data-page="home"] .grid > li { flex-basis: calc(33.333% - .55rem); }
    }
    @media (max-width: 600px) {
      body[data-page="home"] .grid > li { flex-basis: calc(50% - .4rem); }
      body[data-page="home"] .grid { gap: .6rem; }
      body[data-page="home"] .category-card { padding: .55rem .4rem; }
      body[data-page="home"] .category-card .badge { width: 2.1rem; height: 2.1rem; border-radius: 11px; }
      body[data-page="home"] .category-card .card-title { font-size: .92rem; }
      body[data-page="home"] .pill { font-size: .72rem; }
      body[data-page="home"] .category-card { min-height: 0; gap: .2rem; }
      body[data-page="home"] .grid { row-gap: .75rem; }
      body[data-page="home"] .hero-logo { width: 68px; height: 68px; }
      body[data-page="home"] .wordmark { margin: .35rem 0 .2rem; }
      body[data-page="home"] .hero .lead { font-size: .88rem; margin: .4rem auto 0; line-height: 1.35; }
      body[data-page="home"] .category-card .card-title { font-size: .85rem; line-height: 1.15; }
      body[data-page="home"] footer { padding: .5rem; font-size: .75rem; }
      body[data-page="home"] footer p { margin: 0; }
    }
    /* ===== Button feel: raised coloured edge that presses down when tapped ===== */
    .category-card, .game-card:not(.disabled), .back, .sound-toggle {
      cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    .category-card {
      border-color: var(--accent);
      box-shadow: 0 6px 0 var(--accent), 0 10px 14px rgba(20, 33, 61, .10);
    }
    .game-card:not(.disabled) {
      border-color: var(--page-accent);
      box-shadow: 0 6px 0 var(--page-accent), 0 10px 14px rgba(20, 33, 61, .10);
    }
    a.category-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 var(--accent), 0 12px 16px rgba(20, 33, 61, .12);
    }
    a.game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 var(--page-accent), 0 12px 16px rgba(20, 33, 61, .12);
    }
    a.category-card:active {
      transform: translateY(6px); transition-duration: .04s;
      box-shadow: 0 0 0 var(--accent), 0 2px 4px rgba(20, 33, 61, .12);
    }
    a.game-card:active {
      transform: translateY(6px); transition-duration: .04s;
      box-shadow: 0 0 0 var(--page-accent), 0 2px 4px rgba(20, 33, 61, .12);
    }
    .back { box-shadow: 0 4px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease; }
    .back:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
    .play { box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
    body[data-page="home"] .grid { gap: .9rem .75rem; }

    /* Sound on/off */
    .sound-toggle {
      position: absolute; top: 1rem; left: 1rem; z-index: 5;
      width: 44px; height: 44px; padding: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: #fff; color: var(--ink); border: 2px solid var(--line);
      box-shadow: 0 3px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease;
    }
    .sound-toggle:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
    .sound-toggle:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
    .sound-toggle svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .sound-toggle .off { display: none; }
    .sound-toggle[aria-pressed="false"] .on { display: none; }
    .sound-toggle[aria-pressed="false"] .off { display: block; }
    body[data-page="category"] .sound-toggle { left: auto; right: 1rem; top: .85rem; }
    /* Seven subjects: four across, then three */
    body[data-page="home"] .grid.many > li { flex: 0 1 calc(25% - .6rem); }
    @media (max-width: 900px) { body[data-page="home"] .grid.many > li { flex-basis: calc(33.333% - .55rem); } }
    @media (max-width: 600px) { body[data-page="home"] .grid.many > li { flex-basis: calc(50% - .4rem); } }

    /* ===== Home page: every game in small tiles, grouped by subject colour ===== */
    body[data-page="home"] main { justify-content: flex-start; max-width: 1240px; padding: .25rem 1.25rem 1rem; }
    body[data-page="home"] .hero { padding: .1rem 0 .5rem; }
    body[data-page="home"] .hero-logo { width: clamp(48px, 8vh, 72px); height: clamp(48px, 8vh, 72px); }
    body[data-page="home"] .wordmark { margin: .3rem 0 .15rem; }
    body[data-page="home"] .wordmark .ac { font-size: clamp(2.2rem, min(9vw, 8vh), 3.6rem); }
    body[data-page="home"] .hero .lead { margin: .3rem auto 0; font-size: clamp(.85rem, 2vh, 1rem); }
    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: .45rem; margin: 0 0 1rem; }
    .chip {
      font: inherit; font-weight: 800; font-size: .85rem; min-height: 40px; padding: .3rem .95rem;
      border-radius: 999px; cursor: pointer; background: #fff; color: var(--accent);
      border: 2px solid var(--accent); box-shadow: 0 3px 0 var(--accent);
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .chip:active { transform: translateY(3px); box-shadow: 0 0 0 var(--accent); }
    .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .chip:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
    .subject[hidden] { display: none; }
    /* Even columns: every card the same width, subjects flow neatly across the page */
    .all-games { column-width: 235px; column-gap: 1.5rem; padding-top: .6rem; }
    .subject { break-inside: avoid; margin: 0 0 1.5rem; }
    .all-games .sticker { margin: 0 0 1rem .2rem; }
    .subject-head {
      display: flex; align-items: center; gap: .55rem; margin: 0 0 .55rem;
      font-size: 1.15rem; font-weight: 800; color: var(--accent);
    }
    .subject-head .badge { width: 2rem; height: 2rem; border-radius: 10px; background: var(--accent); }
    .soon-note { margin: 0; color: var(--muted); font-size: .85rem; }
    /* Sticker book: notebook paper, taped cards, sticker headings in one even grid */
    body[data-page="home"] {
      font-family: "Patrick Hand", ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 29px, var(--ruled) 29px, var(--ruled) 30px);
    }
    body[data-page="home"] .wordmark .ac { font-family: "Fredoka", ui-rounded, sans-serif; transform: rotate(-2deg); }
    body[data-page="home"] .chip { font-family: inherit; font-size: 1.05rem; font-weight: 400; }
    .tiles {
      list-style: none; margin: 0; padding: .6rem 0 1rem;
      display: grid; gap: 1.7rem 1.1rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      grid-auto-rows: 1fr;
    }
    .tiles > li[hidden] { display: none; }
    .tiles > li.head { display: flex; align-items: center; justify-content: center; }
    .sticker {
      display: inline-flex; align-items: center; gap: .5rem; margin: 0;
      background: var(--accent); color: #fff; font-size: 1.35rem; font-weight: 400; line-height: 1.1;
      padding: .25rem 1rem .25rem .45rem; border-radius: 999px; text-align: left;
      transform: rotate(-1.5deg); box-shadow: 2px 3px 0 rgba(0, 0, 0, .2);
    }
    .sticker-icon { flex: none; width: 1.9rem; height: 1.9rem; padding: .3rem; background: rgba(255, 255, 255, .3); border-radius: 50%; display: inline-flex; }
    .sticker-icon .icon-svg { width: 100%; height: 100%; }
    .tile {
      position: relative; display: block; height: 100%;
      padding: 1.1rem .75rem .6rem; text-decoration: none; color: var(--ink);
      background: var(--card); border: 2px solid var(--ink); border-radius: 6px;
      box-shadow: 4px 5px 0 var(--accent); cursor: pointer;
      transform: rotate(var(--tilt, -1deg));
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .tiles > li:nth-child(3n) .tile { --tilt: 1.2deg; }
    .tiles > li:nth-child(4n+1) .tile { --tilt: -1.7deg; }
    /* The tape strip carries the subject logo and name, in the subject colour */
    .tape {
      position: absolute; top: -13px; left: 50%; transform: translateX(-50%) rotate(-2deg);
      display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap;
      padding: .05rem .7rem .05rem .3rem; border-radius: 4px;
      background: var(--accent); color: #fff; font-size: .92rem; line-height: 1.3;
      box-shadow: 1px 2px 0 rgba(0, 0, 0, .2);
    }
    .tape-icon { width: 1.15rem; height: 1.15rem; display: inline-flex; background: rgba(255, 255, 255, .28); border-radius: 50%; padding: .16rem; }
    .tape-icon .icon-svg { width: 100%; height: 100%; }
    .tile-icon { float: left; width: 2.3rem; height: 2.3rem; margin: 0 .55rem .1rem 0; color: var(--accent); display: inline-flex; }
    .tile-icon .icon-svg { width: 100%; height: 100%; }
    .tile-text { display: block; }
    .tile-sub { display: none; }
    .tile-title { display: block; font-size: 1.2rem; font-weight: 400; line-height: 1.05; }
    .tile-sum {
      display: -webkit-box; clear: both; margin-top: .3rem; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      font-size: .98rem; line-height: 1.2; color: var(--muted);
    }
    a.tile:hover { transform: rotate(0) scale(1.04); box-shadow: 6px 7px 0 var(--accent); }
    a.tile:active { transform: rotate(0) translateY(3px); box-shadow: 1px 2px 0 var(--accent); transition-duration: .04s; }
    .tile.disabled { border-style: dashed; box-shadow: none; cursor: default; }
    @media (max-width: 520px) {
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem .7rem; }
      .tape { font-size: .78rem; padding-right: .5rem; }
      .tile { padding: .8rem .5rem .5rem; }
      .tile-icon { width: 1.8rem; height: 1.8rem; }
      .tile-title { font-size: 1.05rem; }
      .tile-sum { display: none; }
      .sticker { font-size: 1.1rem; }
    }

    /* ===== Page themes (subject colours never change) ===== */
    :root[data-theme="sky"]    { --bg: #e8f4ff; --line: #c9def2; --ruled: #c3daf0; }
    :root[data-theme="sunny"]  { --bg: #fff6cf; --line: #f0e1a1; --ruled: #f1e2a8; }
    :root[data-theme="candy"]  { --bg: #fff0f5; --line: #f6d3e0; --ruled: #f6d3e0; }
    :root[data-theme="mint"]   { --bg: #eafaf1; --line: #cfe9da; --ruled: #c9e6d6; }
    :root[data-theme="night"]  {
      --bg: #101a33; --card: #1b2a4d; --ink: #eef2ff; --muted: #aab6d6; --line: #2b3d6b;
      --brand: #8fb0ff; --focus: #8fb0ff; --ruled: rgba(150, 180, 255, .13); color-scheme: dark;
    }
    header.site, .back, .sound-toggle, .theme-cog, .chip { background: var(--card); }
    .sound-toggle, .theme-cog { color: var(--ink); }
    :root[data-theme="night"] .chip[aria-pressed="false"] { color: #fff; }
    :root[data-theme="night"] .tile-sub { filter: brightness(1.4); }

    /* Theme cog, next to the sound button */
    .theme-cog {
      position: absolute; top: 1rem; left: 4rem; z-index: 5;
      width: 44px; height: 44px; padding: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); cursor: pointer;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .theme-cog:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
    .theme-cog:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
    .theme-cog svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    body[data-page="category"] .theme-cog { left: auto; right: 4.1rem; top: .85rem; }
    .theme-panel {
      position: absolute; top: 4rem; left: 1rem; z-index: 6; width: min(300px, calc(100vw - 2rem));
      background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 20px;
      padding: .9rem; box-shadow: 0 12px 30px rgba(20, 33, 61, .2);
    }
    body[data-page="category"] .theme-panel { left: auto; right: 1rem; top: 3.9rem; }
    .theme-panel[hidden] { display: none; }
    .theme-panel h2 { font-size: 1rem; margin: 0 0 .6rem; }
    .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .swatch {
      display: flex; flex-direction: column; align-items: center; gap: .25rem; padding: .5rem .2rem;
      font: inherit; font-weight: 700; font-size: .78rem; color: var(--ink);
      background: transparent; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; min-height: 64px;
    }
    .swatch i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(0, 0, 0, .15); display: block; }
    .swatch[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
    .swatch:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }

    /* A subject with no platforms yet: not pressable */
    .category-card.disabled {
      border-style: dashed; box-shadow: none; cursor: default;
    }
    .category-card.disabled .pill { background: transparent; border: 2px dashed var(--line); }
  </style>
</head>
